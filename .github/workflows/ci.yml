name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build
      - name: Smoke-test the benchmarks
        shell: bash
        env:
          IMG_DIR: ${{ runner.temp }}/images
        run: |
          ./scripts/get-images.sh "$IMG_DIR"
          dotnet bench/WebpResizer.Benchmarks/bin/Release/net10.0/WebpResizer.Benchmarks.dll check "${{ runner.temp }}/check"
      - name: Pack
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack src/WebpResizer -c Release --no-build -o artifacts
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: nupkg
          path: artifacts/*.nupkg
